app = "white-rabbit-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"
  context = "."

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
