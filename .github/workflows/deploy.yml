name: Deploy to Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: white_rabbit
          POSTGRES_USER: white_rabbit
          POSTGRES_PASSWORD: white_rabbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U white_rabbit -d white_rabbit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://white_rabbit:white_rabbit@localhost:5432/white_rabbit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run API tests
        run: |
          cd apps/api
          uv sync --dev
          uv run alembic upgrade head
          uv run pytest tests -q

      - name: Run core tests
        run: |
          cd packages/core
          uv sync --dev
          uv run pytest tests -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run web tests
        run: |
          cd apps/web
          # Work around npm optional-dependency omissions on GitHub runners
          # that can skip Rolldown's native Linux binding and break Vitest startup.
          npm install
          npm test
          npm run build

  deploy-api:
    name: Deploy API to Fly.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy apps/api --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    name: Deploy Web to Vercel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: vercel/action-deploy@v1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
