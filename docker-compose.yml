services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: white_rabbit
      POSTGRES_PASSWORD: white_rabbit_dev
      POSTGRES_DB: white_rabbit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U white_rabbit -d white_rabbit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
